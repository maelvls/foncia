<!DOCTYPE html>
<html lang="fr">
<head>
<title>Copropriétaires · Terra Nostra 2</title>
{{template "head"}}
</head>
<body>
{{template "nav" .}}

<h1>Copropriétaires <small>{{len .Lignes}}</small></h1>

<div class="scroll">
<table>
	<thead>
		<tr><th>Appartement</th><th>Nom</th><th>Adresse</th><th>Places de parking</th></tr>
	</thead>
	<tbody>
		{{range .Lignes}}
		<tr>
			<td>{{if .Apartment}}<strong>{{.Apartment}}</strong>{{end}}</td>
			<td>{{.Name}}</td>
			<td>{{.Address}}</td>
			<td>{{range $i, $p := .Parking}}{{if $i}}, {{end}}{{$p}}{{end}}</td>
		</tr>
		{{else}}
		<tr><td colspan="4" class="muted">Aucun copropriétaire.</td></tr>
		{{end}}
	</tbody>
</table>
</div>
</body>
</html>
