<!DOCTYPE html>
<html>
<head>
<title>Liste des co-propriétaires</title>
<meta charset="utf-8">
</head>
<body>
	<h1>Liste des co-propriétaires</h1>
	<table>
<thead>
	<tr>
		<th>Nom</th>
		<th>Adresse</th>
		<th>Appartement</th>
		<th>Places de parking</th>
	</tr>
</thead>
<tbody>
	{{range .}}
	<tr>
		<td>{{.Name}}</td>
		<td>{{.Address}}</td>
		<td>{{.Apartment}}</td>
		<td>{{range .Parking}}{{.}} {{end}}</td>
	</tr>
	{{end}}
</tbody>
	</table>
</body>
</html>
